spring:
  application:
    name: achhecode-playwright

logging:
  file:
    name: ./logs/playwright-core.log
  level:
    root: INFO
    com.achhecode.playwright: INFO

playwright:
  capture:
    dir: ./captures

  browser:
    mode: HEADLESS
    headless: true
    eager-connect: true
    host: 127.0.0.1
    port: 9222
    connect-timeout-ms: 10000
    default-timeout-ms: 30000
    navigation-timeout-ms: 60000
    startup-timeout-ms: 15000
    args: []
